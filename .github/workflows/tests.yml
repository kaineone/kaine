# The offline test suite — the FIRST CI job that actually runs pytest.
#
# Until this job, nothing in CI exercised the test suite: import-boundary and
# CodeQL are static, and container-image-smoke only builds the image and asserts
# the cycle refuses to boot without an operator gate (it never runs pytest). That
# left a gap — a dependency-range bump (Dependabot edits pyproject.toml) or a code
# change could land with the 3000+ test suite never run in CI. This job closes it.
#
# Every pull request and every merge-queue batch runs it, because pytest is a
# required check. Pushes to main are path-filtered to code, tests, pyproject, the
# installers, container and deployment artifacts, documentation and the workflow
# itself. Offline: fakes stand in for
# external services; no entity boot, no network services, no secrets. CPU torch
# keeps the install light (the forward models are CPU-only by policy).
name: tests

on:
  # Nightly: the full suite, slow tests included, so a slow test that no pull
  # request ran still runs every day. A red nightly blocks merging.
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "kaine/**"
      - "tests/**"
      - "conftest.py"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
      - ".github/slow-test-paths.txt"
      - "scripts/**"
      - "config/**"
      - "compose/**"
      - "quadlet/**"
      - "docker/**"
      - "Dockerfile"
      - "docs/**"
  # Every pull request runs the suite, with no path filter: pytest is a required
  # check, and a required check that never starts would block the merge queue.
  pull_request:
    branches: ["main"]
  # The merge queue tests each batch before it reaches main.
  merge_group:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (offline suite, py${{ matrix.python-version }}${{ matrix.torch-bound == 'min' && ', torch min' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # "max": the newest in-range torch pip resolves; "min": the lower bound of
        # the tested range in pyproject.toml. The include adds a separate job
        # because its torch-bound value differs from every base combination.
        torch-bound: ["max"]
        include:
          - python-version: "3.12"
            torch-bound: "min"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so a pull request can diff against its base commit to
          # decide whether the slow tests run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU torch
        # The default torch wheel is multi-GB (CUDA). The suite is CPU-only by
        # policy (forward models pin cpu), so the CPU wheel is both sufficient and
        # far lighter. Scoped to this step's index; the package install below uses
        # PyPI for everything else and sees torch already satisfied.
        run: |
          if [ "${{ matrix.torch-bound }}" = "min" ]; then
            TORCH_MIN=$(python -c "import sys,re,tomllib; deps=tomllib.load(open('pyproject.toml','rb')).get('project',{}).get('optional-dependencies',{}).get('core',[]); req=next(x for x in deps if x.startswith('torch') and any(c in x for c in '<>=!~')); m=re.search(r'>=([0-9.]+)',req); sys.stdout.write(m.group(1))")
            python -m pip install "torch==${TORCH_MIN}" torchvision --index-url https://download.pytorch.org/whl/cpu
            TV_VERSION=$(python -c "import torchvision; print(torchvision.__version__)")
            printf "torch==%s\ntorchvision==%s\n" "${TORCH_MIN}" "${TV_VERSION}" > /tmp/torch-constraints.txt
          else
            # torchvision from the same CPU index as torch, pinned for the package
            # install below: a PyPI torchvision built against another torch breaks
            # transformers' lazy model imports (torchvision::nms does not exist).
            python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            TORCH_VERSION=$(python -c "import torch; print(torch.__version__)")
            TV_VERSION=$(python -c "import torchvision; print(torchvision.__version__)")
            printf "torch==%s\ntorchvision==%s\n" "${TORCH_VERSION}" "${TV_VERSION}" > /tmp/torch-constraints.txt
          fi

      - name: Install package (editable) + the extras the suite exercises
        # EDITABLE (-e): a non-editable install ships only the packages enumerated
        # in [tool.setuptools] and silently omits others (e.g. kaine.oscillator),
        # so a subprocess `python -m kaine.cycle` fails to import. -e puts the whole
        # source tree on the path, matching how the suite is run locally.
        #
        # Extras: ~30 tests hard-require optional deps (opencv for foveation/topos,
        # pymdp+jax for active-inference, librosa for prosody, snnTorch for the
        # oscillator) and ModuleNotFoundError rather than skip when they are absent,
        # so the suite is only green with them installed. The heavy/fragile extras
        # whose tests DO skip-when-missing are left out on purpose: `audio`'s funasr
        # (emotion2vec + torchaudio matching), `training`'s unsloth, and
        # `internvideo-flash` (flash-attn has no prebuilt wheel). The light audio
        # deps (librosa/av/webrtcvad/soundfile) are pulled directly so the prosody
        # path runs without dragging in funasr.
        run: |
          CONSTRAINT=""
          if [ -f /tmp/torch-constraints.txt ]; then
            CONSTRAINT="-c /tmp/torch-constraints.txt"
          fi
          # Every runtime extra except [audio]: its pinned av/funasr would build
          # from source here. The audio packages the suite needs are installed
          # directly below, as wheels.
          python -m pip install $CONSTRAINT \
            -e ".[test,browser-test,core,memory,memory-edge,nexus,nvidia,vision,reasoning,worldmodel,oscillator,internvideo]" \
            librosa av webrtcvad soundfile

      - name: Show installed torch version
        run: python -c "import torch; print(torch.__version__)"

      - name: Decide whether the slow tests run
        # Slow tests (marker `slow`) run on main, nightly and on demand. On a pull
        # request or a merge-queue batch they run only when it changes a path listed in
        # .github/slow-test-paths.txt; tests/test_slow_lane.py keeps that list
        # covering every slow-marked test file.
        id: lane
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            merge_group) base="${{ github.event.merge_group.base_sha }}" ;;
            *) base="" ;;
          esac
          # No base to diff against: run the slow tests rather than skip them.
          if [ -z "$base" ]; then
            echo "slow=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -v '^#' .github/slow-test-paths.txt | grep -v '^[[:space:]]*$' > /tmp/slow-paths.re
          changed="$(git diff --name-only "$base" HEAD)"
          if printf '%s\n' "$changed" | grep -E -q -f /tmp/slow-paths.re; then
            echo "slow=true" >> "$GITHUB_OUTPUT"
          else
            echo "slow=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the offline test suite
        # In parallel, one worker per CPU, each test file kept on one worker so
        # tests that share module state stay together. A test that runs longer
        # than 10 minutes dumps every thread's stack to the log (pytest's
        # built-in faulthandler), so a hang names itself instead of ending as a
        # silent job timeout.
        run: python -m pytest -q -n auto --dist loadfile -m "not slow" -o faulthandler_timeout=600

      - name: Run the slow tests
        if: steps.lane.outputs.slow == 'true'
        run: python -m pytest -q -m slow -o faulthandler_timeout=600
