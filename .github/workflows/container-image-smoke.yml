name: container-image-smoke

# Image-build smoke test for the containerized deployment (design §12 D4).
#
# Builds the CPU and CUDA image flavors and runs a NON-ENTITY smoke:
#   - `python -m kaine.cycle` with NO operator gate MUST refuse to boot (exit 2)
#     — it never births an entity in CI.
#   - the offline-mode env guards (HF_HUB_OFFLINE / TRANSFORMERS_OFFLINE) are set.
#   - no model weights are present in any image layer.
# It never boots an entity, never needs a GPU, never downloads weights.
on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker/**"
      - ".dockerignore"
      - "compose/**"
      - ".github/workflows/container-image-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker/**"
      - ".dockerignore"
      - "compose/**"
      - ".github/workflows/container-image-smoke.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build ${{ matrix.flavor }} + non-entity smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            build_base: python:3.12-slim
            runtime_base: python:3.12-slim
          # CUDA build compiles against the NVIDIA devel base; no GPU is needed
          # to BUILD or to run the non-entity smoke (refusal path is CPU-only).
          - flavor: cuda
            build_base: nvidia/cuda:12.8.0-cudnn-devel-ubuntu22.04
            runtime_base: nvidia/cuda:12.8.0-cudnn-runtime-ubuntu22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.flavor }} runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kaine:${{ matrix.flavor }}
          target: runtime
          build-args: |
            FLAVOR=${{ matrix.flavor }}
            BUILD_BASE=${{ matrix.build_base }}
            RUNTIME_BASE=${{ matrix.runtime_base }}

      - name: Cycle refuses to boot with no operator gate (no entity)
        run: |
          set +e
          docker run --rm kaine:${{ matrix.flavor }} python -m kaine.cycle
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

      - name: The package imports from any working directory
        run: |
          # Study children run with their line directory as the working
          # directory, so `kaine` must not depend on the cwd being /app.
          docker run --rm -w /tmp kaine:${{ matrix.flavor }} \
            python -c "import kaine; assert kaine.__file__.startswith('/app/kaine/'), kaine.__file__; print(kaine.__file__)"

      - name: The default vision encoder's modeling code loads from any directory
        run: |
          # The vision module's shipped backend is InternVideo-Next: its vendored code
          # and dependencies must import in the image, from a child's cwd.
          docker run --rm -w /tmp kaine:${{ matrix.flavor }} python -c \
            "from kaine.modules.vision.internvideo_next_loader import _ensure_attention_backend, _import_vendored_classes; _ensure_attention_backend(); _import_vendored_classes(); print('vendored encoder imports')"

      - name: Offline model guards are set in the image
        run: |
          docker run --rm kaine:${{ matrix.flavor }} \
            sh -c 'test "$HF_HUB_OFFLINE" = "1" && test "$TRANSFORMERS_OFFLINE" = "1"'

      - name: Abliteration probes are present and trainer service imports from any directory
        run: |
          docker run --rm kaine:${{ matrix.flavor }} \
            test -s /app/eval_probes/abliteration_probes.jsonl
          docker run --rm -w /tmp kaine:${{ matrix.flavor }} \
            python -c "import kaine.modules.sleep.trainer_service; print('trainer_service imports')"

      - name: An old-layout state volume upgrades as the image's user
        run: |
          set -euo pipefail

          OLD=$(docker run --rm kaine:${{ matrix.flavor }} python -c "from kaine import legacy_names as T; print(next(k for k, e in T.MODULES.items() if e['new_key'] == 'sleep'))")

          trap 'docker volume rm -f kaine-smoke-state kaine-smoke-jobs || true' EXIT

          docker volume create kaine-smoke-state
          docker volume create kaine-smoke-jobs

          docker run --rm --user 0 --entrypoint sh \
            -v kaine-smoke-state:/s \
            -e OLD="$OLD" \
            kaine:${{ matrix.flavor }} \
            -c 'mkdir -p /s/$OLD/adapters /s/$OLD/voice_align_jobs && echo window > /s/$OLD/organ_window.json && echo adapter > /s/$OLD/adapters/a.gguf && chown -R 10001:10001 /s'

          docker run --rm \
            -v kaine-smoke-state:/app/state \
            -v kaine-smoke-jobs:/trainer-jobs \
            --tmpfs /app/state/perceptual_locus:mode=01777 \
            kaine:${{ matrix.flavor }} \
            python -m kaine.lifecycle.rename_state /app/state --no-qdrant

          docker run --rm \
            -v kaine-smoke-state:/app/state \
            -v kaine-smoke-jobs:/trainer-jobs \
            --tmpfs /app/state/perceptual_locus:mode=01777 \
            -e OLD="$OLD" \
            kaine:${{ matrix.flavor }} \
            sh -c 'test -s /app/state/sleep/organ_window.json && test -s /app/state/sleep/adapters/a.gguf && test ! -e /app/state/$OLD'

          output=$(docker run --rm \
            -v kaine-smoke-state:/app/state \
            -v kaine-smoke-jobs:/trainer-jobs \
            --tmpfs /app/state/perceptual_locus:mode=01777 \
            kaine:${{ matrix.flavor }} \
            python -m kaine.lifecycle.rename_state /app/state --no-qdrant --dry-run)

          if grep -E '^(move|stage|sqlite|qdrant_alias|remove empty):' <<<"$output"; then
            echo "unexpected dry-run steps:"; echo "$output"; exit 1
          fi

      - name: No model weights baked into any layer
        run: |
          # Fail if any weight extension exists inside the image filesystem.
          docker run --rm kaine:${{ matrix.flavor }} sh -c '
            found=$(find / -xdev \( -name "*.gguf" -o -name "*.safetensors" \
              -o -name "*.ckpt" -o -name "*.pt" -o -name "*.bin" \) \
              -not -path "/opt/venv/*" 2>/dev/null | head -n 5)
            if [ -n "$found" ]; then
              echo "model weights found in image layer:"; echo "$found"; exit 1
            fi
            echo "no model weights in image"'
