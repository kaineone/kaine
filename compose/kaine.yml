#
# The KAINE service topology of record (design.md §2). One Compose project
# stands up the full local instance — event bus, vector store, model server,
# speech-to-text, text-to-speech, and the Nexus web UI — WITHOUT the cognitive
# cycle. Every port is loopback-only, matching compose/redis.yml / qdrant.yml.
#
#   Default bring-up (no entity):
#     docker compose -f compose/kaine.yml up -d
#
#   One-shot setup — pull images + download ALL model weights into the shared
#   kaine-models volume (design §6); runtime then reaches no network for models:
#     docker compose -f compose/kaine.yml --profile setup run --rm kaine-provision
#
#   Boot the cognitive cycle — a DELIBERATE, operator-supervised step. The cycle
#   still refuses to start without KAINE_CYCLE_OPERATOR_PRESENT=1 (or the
#   research safety net); see docs/04-getting-started/first-boot.md:
#     KAINE_CYCLE_OPERATOR_PRESENT=1 \
#       docker compose -f compose/kaine.yml --profile cycle run --rm kaine-cycle
#
# GPU: the reservations below target a two-GPU NVIDIA host (organ on card 0,
# vision + TTS on card 1). For a single GPU or CPU-only host, overlay
# compose/kaine.single-gpu.yml or compose/kaine.cpu.yml (see D2 docs). Secrets
# and gate flags come from compose/.env (see compose/.env.example).

name: kaine

# Shared log rotation for every service: json-file capped at 50m x 3 files so
# a chatty cycle or nexus cannot fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# --- reusable fragments ---------------------------------------------------
x-kaine-image: &kaine-image
  build:
    context: ..
    dockerfile: Dockerfile
    # The runtime image (the Dockerfile's default target; named explicitly).
    target: runtime
    args:
      FLAVOR: ${KAINE_FLAVOR:-cuda}
      # [full] carries every runtime extra (core, memory, nexus, vision, audio,
      # reasoning, worldmodel, oscillator); [internvideo] adds the Topos encoder's
      # einops/timm/easydict. Override to a leaner set for other deployments.
      KAINE_EXTRAS: ${KAINE_EXTRAS:-.[test,full,internvideo]}
      # Bake the source revision into the image (e.g. from
      # `git rev-parse --short HEAD`); compute_git_sha falls back to it.
      GIT_SHA: "${KAINE_GIT_SHA:-}"
  image: ${KAINE_IMAGE:-kaine:${KAINE_FLAVOR:-cuda}}

# NVIDIA device reservation fragments (design §4). Docker reads
# deploy.resources.reservations.devices; the CPU/single-GPU overlays drop them.
x-gpu-card0: &gpu-card0
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${KAINE_ORGAN_GPU:-0}"]
            capabilities: [gpu]

x-gpu-card1: &gpu-card1
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${KAINE_VISION_GPU:-1}"]
            capabilities: [gpu]

# GPU reservation for the voice-alignment trainer. Defaults to the same card as
# the organ so a single-GPU host can share contention logic (the trainer waits
# until the organ is asleep and free VRAM is available).
x-gpu-trainer: &gpu-trainer
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${KAINE_TRAINER_GPU:-${KAINE_ORGAN_GPU:-0}}"]
            capabilities: [gpu]

services:
  # ---- existing containerized services (event bus + vector store) --------
  kaine-redis:
    image: redis:7.2-alpine
    container_name: kaine-redis
    ports:
      - "127.0.0.1:${KAINE_REDIS_HOST_PORT:-6479}:6379"
    command:
      - redis-server
      - --requirepass
      - ${KAINE_REDIS_PASSWORD:?KAINE_REDIS_PASSWORD must be set (see compose/.env.example)}
      - --bind
      - "0.0.0.0"
      - --protected-mode
      - "yes"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Memory ceiling, host-configurable through KAINE_REDIS_MAXMEMORY in
      # compose/.env (default 4gb). noeviction is kept below: the bus fails
      # loud rather than silently evicting events. `python -m kaine.preboot`
      # checks the configured stream caps fit ("Bus budget" row).
      - --maxmemory
      - ${KAINE_REDIS_MAXMEMORY:-4gb}
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    volumes:
      - kaine-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$KAINE_REDIS_PASSWORD" ping | grep PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      KAINE_REDIS_PASSWORD: ${KAINE_REDIS_PASSWORD:?KAINE_REDIS_PASSWORD must be set (see compose/.env.example)}
    logging: *default-logging

  kaine-qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: kaine-qdrant
    ports:
      - "127.0.0.1:${KAINE_QDRANT_HOST_PORT:-6533}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${KAINE_QDRANT_API_KEY:?KAINE_QDRANT_API_KEY must be set (see compose/.env.example)}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - kaine-qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # qdrant:v1.19.1 ships neither wget nor curl (the image is minimal), so an
      # HTTP-client probe exits 127 and the container is falsely unhealthy, blocking
      # every dependent. The image DOES ship bash, whose /dev/tcp opens a TCP socket
      # with no external tools — qdrant binds 6333 only once it is serving, so a
      # successful connect is a sound readiness signal.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

  # ---- model server: OpenAI-compatible language organ (design §5) --------
  # Default image is a generic OpenAI-compatible GGUF server (llama.cpp). Set
  # KAINE_MODEL_SERVER_IMAGE / _CMD to use vLLM or another server. For the
  # Unsloth shared inference+training server, use the `organ=host` override
  # (compose/kaine.organ-host.yml).
  # The organ loads a per-entity GGUF LoRA from the read-only organ-adapters
  # volume via docker/organ-launcher.sh and restarts when the cycle promotes a
  # new adapter. The launcher passes the remaining command line to llama-server.
  # The organ unloads after KAINE_MODEL_SERVER_SLEEP_IDLE_SECONDS idle
  # seconds (default 600; -1 keeps it loaded) and reloads on the next request;
  # a KAINE_MODEL_SERVER_CMD override must pass --sleep-idle-seconds itself.
  kaine-model-server:
    <<: *gpu-card0
    # llama.cpp build b11382 pinned by digest; bumps change compose/kaine*.yml, quadlet and the trainer converter together.
    image: ${KAINE_MODEL_SERVER_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:ef08b5a98b1170f2b62177be0a4027c88a84043c55afbf190dd18b9e7cdcfebf}
    container_name: kaine-model-server
    ports:
      - "127.0.0.1:${KAINE_MODEL_SERVER_HOST_PORT:-11434}:8080"
    # The API key is supplied via LLAMA_API_KEY (below), NOT a --api-key flag: an
    # empty ${KAINE_MODEL_SERVER_API_KEY} would render a bare `--api-key` with no
    # value, which llama-server rejects ("expected value for argument"), crash-looping
    # the organ. The env var tolerates empty (= no auth) and a set value (= auth).
    environment:
      LLAMA_API_KEY: ${KAINE_MODEL_SERVER_API_KEY:-}
    entrypoint: ["/bin/sh", "/opt/kaine/organ-launcher.sh"]
    command: ${KAINE_MODEL_SERVER_CMD:---model /models/Qwen3.5-4B-abliterated-GGUF/KAINE-Qwen3.5-4B-abliterated.Q4_K_M.gguf --alias kaineone/Qwen3.5-4B-abliterated-GGUF --host 0.0.0.0 --port 8080 --sleep-idle-seconds ${KAINE_MODEL_SERVER_SLEEP_IDLE_SECONDS:-600} --fit off -ngl ${KAINE_MODEL_SERVER_NGL:-999} --cache-ram ${KAINE_MODEL_SERVER_CACHE_RAM_MIB:-1024} -c ${KAINE_MODEL_SERVER_CTX:-32768} -np ${KAINE_MODEL_SERVER_PARALLEL:-4} -ctk f16 -ctv f16}
    volumes:
      - kaine-models:/models:ro
      - ../docker/organ-launcher.sh:/opt/kaine/organ-launcher.sh:ro
      - kaine-organ-adapters:/organ-adapters:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8080/health >/dev/null'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- speech-to-text: Speaches / faster-distil-Whisper ------------------
  # Runs on CPU with medium.en — running Speaches on GPU triggers a cuDNN crash
  # when the secondary GPU also serves TTS (docs/04-getting-started/services.md#speaches-stt).
  # No GPU reservation by design.
  kaine-speaches:
    image: ${KAINE_SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    container_name: kaine-speaches
    ports:
      - "127.0.0.1:${KAINE_SPEACHES_HOST_PORT:-8000}:8000"
    environment:
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - kaine-models:/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8000/v1/models >/dev/null'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- text-to-speech: Chatterbox (shares the secondary GPU) -------------
  # No canonical upstream image; set KAINE_CHATTERBOX_IMAGE to your build.
  kaine-chatterbox:
    <<: *gpu-card1
    image: ${KAINE_CHATTERBOX_IMAGE:-kaine-chatterbox:local}
    container_name: kaine-chatterbox
    ports:
      - "127.0.0.1:${KAINE_CHATTERBOX_HOST_PORT:-8883}:8883"
    environment:
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - kaine-models:/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8883/get_predefined_voices >/dev/null'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Nexus web UI: always-up, holds NO entity (design §2) --------------
  kaine-nexus:
    <<: *kaine-image
    container_name: kaine-nexus
    command: ["python", "-m", "kaine.nexus"]
    ports:
      - "127.0.0.1:${KAINE_NEXUS_HOST_PORT:-8088}:8088"
    environment:
      # Growing data stays under the working directory /app, where the
      # named volumes are mounted; a host [storage].data_root in the shared
      # operator config must not redirect container writes.
      KAINE_DATA_ROOT: /app
      KAINE_REDIS_PASSWORD: ${KAINE_REDIS_PASSWORD:?KAINE_REDIS_PASSWORD must be set (see compose/.env.example)}
      # Bus by service name on the bridge network (see kaine-cycle). Nexus reaches
      # the bus through load_bus_config, which reads KAINE_REDIS_URL over the toml.
      KAINE_REDIS_URL: redis://:${KAINE_REDIS_PASSWORD}@kaine-redis:6379/0
      KAINE_QDRANT_API_KEY: ${KAINE_QDRANT_API_KEY:?KAINE_QDRANT_API_KEY must be set (see compose/.env.example)}
      KAINE_MODEL_SERVER_API_KEY: ${KAINE_MODEL_SERVER_API_KEY:-}
      # Same at-rest posture as the cycle, so the "state encryption" health line is
      # not DEGRADED and Nexus can read/write the shared encrypted fork/snapshots.
      KAINE_STATE_KEY: ${KAINE_STATE_KEY:-}
      # Bind the diagnostics server on all interfaces INSIDE the container so the
      # published 127.0.0.1:8088 mapping can reach it; the shipped [nexus].host is
      # 127.0.0.1, which binds the container's own loopback and is unreachable via
      # the port mapping. Publishing is still loopback-only (see ports:).
      KAINE_NEXUS_HOST: 0.0.0.0
      # The bind is all-interfaces inside the container; publishing stays 127.0.0.1-only.
      # Nexus still refuses to start without a token.
      KAINE_NEXUS_NON_LOOPBACK_ALLOWED: "1"
      # Open access (no sign-in) is the default: Nexus is published on 127.0.0.1 only.
      # For the tailnet, run `tailscale serve --bg 8088` and set the machine's ts.net
      # name in KAINE_NEXUS_EXTRA_HOSTS in compose/.env (never committed).
      KAINE_NEXUS_ACCESS: ${KAINE_NEXUS_ACCESS:-}
      KAINE_NEXUS_EXTRA_HOSTS: ${KAINE_NEXUS_EXTRA_HOSTS:-}
      KAINE_NEXUS_PUBLISHED_PORT: ${KAINE_NEXUS_HOST_PORT:-8088}
      # Token from env first; empty falls through to the read-only mounted config/secrets.toml.
      KAINE_NEXUS_TOKEN: ${KAINE_NEXUS_TOKEN:-}
      # Allowed Origins must reflect the host-published port, not the in-container 8088.
      KAINE_NEXUS_ALLOWED_ORIGINS: http://127.0.0.1:${KAINE_NEXUS_HOST_PORT:-8088},http://localhost:${KAINE_NEXUS_HOST_PORT:-8088}
    volumes:
      # Operator overlay + secrets bind-mounted READ-ONLY, never COPYed (design §8).
      - ../config/kaine.operator.toml:/app/config/kaine.operator.toml:ro
      - ../config/secrets.toml:/app/config/secrets.toml:ro
      # The app writes its state CWD-relative under WORKDIR /app (Dockerfile), so
      # the durable state volume mounts at /app/state — NOT /state — or nothing
      # the entity writes would survive down/up.
      - kaine-state:/app/state
      # Shared evaluation-data volume (see kaine-cycle) — Nexus reads the
      # admissibility manifest under runs/ and the evaluation tab's observer
      # output beside it.
      - kaine-eval-data:/app/data/evaluation
    restart: unless-stopped
    depends_on:
      kaine-redis:
        condition: service_healthy
      kaine-qdrant:
        condition: service_healthy
    healthcheck:
      # python (always present in the image) instead of curl (which is not) — a
      # curl-based check exits 127 and marks the container falsely unhealthy.
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8088/diagnostics/health.json'', timeout=4).status==200 else 1)"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- the cognitive cycle: THE ENTITY. profile-gated, never default up --
  # `profiles: [cycle]` keeps it out of a plain `up`. The cycle refuses to boot
  # unless the operator explicitly exports KAINE_CYCLE_OPERATOR_PRESENT=1 (or the
  # research safety net is verified). NO boot-gate var is defaulted permissive
  # here (design §8): the operator sets them explicitly, preserving supervised
  # first boot.
  kaine-cycle:
    <<: [*kaine-image, *gpu-card1]
    profiles: [cycle]
    container_name: kaine-cycle
    command: ["python", "-m", "kaine.cycle"]
    environment:
      # Growing data stays under the working directory /app, where the
      # named volumes are mounted; a host [storage].data_root in the shared
      # operator config must not redirect container writes.
      KAINE_DATA_ROOT: /app
      KAINE_REDIS_PASSWORD: ${KAINE_REDIS_PASSWORD:?KAINE_REDIS_PASSWORD must be set (see compose/.env.example)}
      # On the compose bridge network the bus is reached by SERVICE NAME, not the
      # host-facing 127.0.0.1:6479 mapping the shipped config/kaine.toml targets.
      # load_bus_config honours KAINE_REDIS_URL over the toml host/port, so this
      # redirects the bus for the containerized cycle without editing that config.
      KAINE_REDIS_URL: redis://:${KAINE_REDIS_PASSWORD}@kaine-redis:6379/0
      KAINE_QDRANT_API_KEY: ${KAINE_QDRANT_API_KEY:?KAINE_QDRANT_API_KEY must be set (see compose/.env.example)}
      KAINE_MODEL_SERVER_API_KEY: ${KAINE_MODEL_SERVER_API_KEY:-}
      # Encryption-at-rest key (design §7); empty unless the operator sets it.
      KAINE_STATE_KEY: ${KAINE_STATE_KEY:-}
      # Model weights live on the shared read-mostly kaine-models volume, apart
      # from the entity-state volume — the encoder + embedder load from here.
      KAINE_MODELS_DIR: /models
      # Boot gates: NOT defaulted to a permissive value. The operator must pass
      # them on the command line to boot the entity.
      KAINE_CYCLE_OPERATOR_PRESENT: ${KAINE_CYCLE_OPERATOR_PRESENT:-}
      KAINE_RESEARCH_MODE: ${KAINE_RESEARCH_MODE:-}
      # Two-layer opt-in for Hypnos voice alignment.
      KAINE_VOICE_ALIGNMENT_OPERATOR_APPROVED: ${KAINE_VOICE_ALIGNMENT_OPERATOR_APPROVED:-}
    volumes:
      - ../config/kaine.operator.toml:/app/config/kaine.operator.toml:ro
      - ../config/secrets.toml:/app/config/secrets.toml:ro
      # Durable entity state at /app/state (the app writes CWD-relative; see nexus).
      - kaine-state:/app/state
      # Provisioned weights (InternVideo-Next encoder, MiniLM embedder, emotion2vec)
      # read-only from the shared model volume; HF_HOME=/models/hf is baked in.
      - kaine-models:/models:ro
      # Shared organ-adapters volume: the cycle writes promoted GGUF LoRAs here
      # (organ_adapter mode) for the launcher to load. Read/write here.
      - kaine-organ-adapters:/organ-adapters
      # Job-queue backend for voice-alignment training: the cycle writes READY jobs,
      # kaine-trainer claims and runs them. Kept off the entity state volume.
      - kaine-trainer-jobs:/app/state/hypnos/voice_align_jobs
      # Evaluation outputs on a SHARED named volume so the Nexus admissibility probe
      # (runs_manifest_root = data/evaluation/runs) sees what the cycle writes —
      # otherwise each container has its own ephemeral /app/data and Nexus reports
      # "manifest absent". kaine-eval-data subsumes the old kaine-runs mount at
      # /app/data/evaluation/runs (the parent dir covers it). Manifests/metadata
      # only — never raw sense data.
      - kaine-eval-data:/app/data/evaluation
      # Workspace-trajectory records, likewise durable and shared with Nexus.
      - kaine-trajectory:/app/data/workspace_trajectory
      # Preservation bundles (durable, never raw sense data).
      - kaine-backups:/app/backups
      # Film-aligned ignition log records (durable, never raw sense data).
      - kaine-ignition:/app/data/ignition
      # Nexus record (`[research_event_log.nexus_record]`): local-only, never
      # exported; what Nexus displays after its privacy filter. ~2 GB per
      # four-hour viewing.
      - kaine-nexus-record:/app/data/nexus_record
      # Perception scratch: RAM-backed and ephemeral, NEVER a durable volume (zero
      # raw-sense-data persistence, design §7). Long-form with mode 1777 because a
      # tmpfs nested under the /app/state volume inherits that mountpoint's 0755
      # root ownership and is otherwise unwritable by the non-root `kaine` user.
      - type: tmpfs
        target: /app/state/perception
        tmpfs:
          mode: 01777
    depends_on:
      kaine-redis:
        condition: service_healthy
      kaine-qdrant:
        condition: service_healthy
    # DELIBERATELY no restart policy on kaine-cycle: an entity process never
    # auto-restarts. Spot handles module-level recovery in-process; a dead
    # cycle is an operator decision, never a supervisor's.
    logging: *default-logging

  # ---- the module-ignition study runner: profile-gated, never default up ---
  # Runs `python -m kaine.research.ignition_study` inside the cycle image so the
  # child cycles it starts reach the bus by service name and the weights at
  # /models. Each child boot is a research-mode boot the study runner starts
  # itself; the gate variables below are copied from kaine-cycle and are NOT
  # defaulted permissive. Study directories live on the durable kaine-studies
  # volume at /app/studies. The operator's media (the programme manifest and
  # the films it names) are added by the local compose overlay as read-only
  # mounts at the same absolute paths the manifest records.
  #
  #   docker compose -f compose/kaine.yml --profile study run --rm kaine-study \
  #     init --study-id <id> --repo-root /app ...
  #   docker compose -f compose/kaine.yml --profile study run --rm kaine-study \
  #     run --study-dir studies/<id>
  kaine-study:
    <<: [*kaine-image, *gpu-card1]
    profiles: [study]
    container_name: kaine-study
    # Keeps the image's tini + entrypoint (owner-only volume perms) and appends
    # the runner, so `run --rm kaine-study <subcommand> ...` passes the
    # subcommand straight to `python -m kaine.research.ignition_study`.
    entrypoint:
      - /usr/bin/tini
      - --
      - /usr/local/bin/kaine-entrypoint
      - python
      - -m
      - kaine.research.ignition_study
    environment:
      # Growing data stays under the working directory /app, where the
      # named volumes are mounted; a host [storage].data_root in the shared
      # operator config must not redirect container writes.
      KAINE_DATA_ROOT: /app
      KAINE_REDIS_PASSWORD: ${KAINE_REDIS_PASSWORD:?KAINE_REDIS_PASSWORD must be set (see compose/.env.example)}
      # On the compose bridge network the bus is reached by SERVICE NAME, not the
      # host-facing 127.0.0.1:6479 mapping the shipped config/kaine.toml targets.
      # load_bus_config honours KAINE_REDIS_URL over the toml host/port, so this
      # redirects the bus for the containerized cycle without editing that config.
      KAINE_REDIS_URL: redis://:${KAINE_REDIS_PASSWORD}@kaine-redis:6379/0
      KAINE_QDRANT_API_KEY: ${KAINE_QDRANT_API_KEY:?KAINE_QDRANT_API_KEY must be set (see compose/.env.example)}
      KAINE_MODEL_SERVER_API_KEY: ${KAINE_MODEL_SERVER_API_KEY:-}
      # Encryption-at-rest key (design §7); empty unless the operator sets it.
      KAINE_STATE_KEY: ${KAINE_STATE_KEY:-}
      # Model weights live on the shared read-mostly kaine-models volume, apart
      # from the entity-state volume — the encoder + embedder load from here.
      KAINE_MODELS_DIR: /models
      # Boot gates: NOT defaulted to a permissive value. The operator must pass
      # them on the command line to boot the entity.
      KAINE_CYCLE_OPERATOR_PRESENT: ${KAINE_CYCLE_OPERATOR_PRESENT:-}
      KAINE_RESEARCH_MODE: ${KAINE_RESEARCH_MODE:-}
      # Two-layer opt-in for Hypnos voice alignment.
      KAINE_VOICE_ALIGNMENT_OPERATOR_APPROVED: ${KAINE_VOICE_ALIGNMENT_OPERATOR_APPROVED:-}
    volumes:
      - ../config/kaine.operator.toml:/app/config/kaine.operator.toml:ro
      - ../config/secrets.toml:/app/config/secrets.toml:ro
      # Provisioned weights, read-only from the shared model volume.
      - kaine-models:/models:ro
      # Shared organ-adapters volume: study writes promoted GGUF LoRAs here
      # (organ_adapter mode) for the launcher to load. Read/write here.
      - kaine-organ-adapters:/organ-adapters
      # Job-queue backend for voice-alignment training. Study steps that enable
      # voice alignment set [hypnos.voice_alignment].trainer_jobs_dir = "/trainer-jobs"
      # (the overlay does this); kaine-trainer claims and runs jobs from here.
      - kaine-trainer-jobs:/trainer-jobs
      # No kaine-state, perception tmpfs, kaine-eval-data or kaine-trajectory: every step runs inside /app/studies/<id>, so a study never touches a live being's volumes.
      # Durable study directories (study.json, steps.jsonl, line directories,
      # analysis). Survives down/up; the runner resumes from it.
      - kaine-studies:/app/studies
    depends_on:
      kaine-redis:
        condition: service_healthy
      kaine-qdrant:
        condition: service_healthy
    # DELIBERATELY no restart policy on kaine-study: a study run is an operator
    # decision, and the child cycles it starts are entities that never
    # auto-restart. An interrupted study resumes by running it
    # again; after a failed step, run it with --retry-failed.
    logging: *default-logging

  # ---- voice-alignment trainer: profile-gated, isolated from entity state ----
  # Runs only when the operator explicitly enables the `training` profile.
  # It sees only the shared job volume and read-only model weights; no Docker
  # socket, no host ports, and no internet (HF_HUB_OFFLINE=1). The trainer service
  # waits for the organ to sleep and for free VRAM before starting a job.
  kaine-trainer:
    <<: *gpu-trainer
    profiles: [training]
    container_name: kaine-trainer
    build:
      context: ..
      dockerfile: Dockerfile
      target: trainer
      args:
        FLAVOR: ${KAINE_FLAVOR:-cuda}
        KAINE_EXTRAS: ${KAINE_EXTRAS:-.[test,full,internvideo]}
        GIT_SHA: "${KAINE_GIT_SHA:-}"
    image: kaine:trainer-${KAINE_FLAVOR:-cuda}
    environment:
      KAINE_MODELS_DIR: /models
      KAINE_TRAINER_JOBS_DIR: /trainer-jobs
      KAINE_ORGAN_URL: http://kaine-model-server:8080
      KAINE_MODEL_SERVER_API_KEY: ${KAINE_MODEL_SERVER_API_KEY:-}
      KAINE_VOICE_ALIGNMENT_OPERATOR_APPROVED: ${KAINE_VOICE_ALIGNMENT_OPERATOR_APPROVED:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - kaine-models:/models:ro
      - kaine-trainer-jobs:/trainer-jobs
    restart: unless-stopped
    depends_on:
      kaine-model-server:
        condition: service_started
    logging: *default-logging

  # ---- setup one-shot: provision images + ALL model weights (design §6) --
  # Downloads the abliterated organ, distil-Whisper, Chatterbox, emotion2vec+,
  # the InternVideo-Next clip encoder (the shipped default vision backend; DINOv2
  # only if [topos].encoder_backend = "dinov2"), and MiniLM BEFORE first boot, so
  # runtime reaches no network for models. Reuses the repo's `hf download`
  # organ provisioning. Runs under `--profile setup`, never at normal `up`.
  kaine-provision:
    <<: *kaine-image
    profiles: [setup]
    container_name: kaine-provision
    entrypoint: ["python", "-m", "kaine.setup.provision"]
    environment:
      HF_HOME: /models/hf
      # Land the organ GGUF + InternVideo-Next weights on the shared model volume
      # (not the entity-state volume) so the model server and cycle find them; the
      # per-model subdir names are unchanged, only the root moves off state/models.
      KAINE_MODELS_DIR: /models
      # Setup phase is the ONLY time network model fetches are allowed.
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    volumes:
      - kaine-models:/models
    logging: *default-logging

volumes:
  kaine-redis-data:
    name: kaine-redis-data
  kaine-qdrant-data:
    name: kaine-qdrant-data
  # Model weights (HF_HOME + organ GGUF). Provisioned at setup; read-mostly.
  # NEVER an image layer.
  kaine-models:
    name: kaine-models
  # Per-entity GGUF LoRAs promoted by Hypnos; read by the organ launcher.
  kaine-organ-adapters:
    name: kaine-organ-adapters
  # Shared job directory for the voice-alignment trainer. The cycle/study write
  # READY jobs here; kaine-trainer claims and runs them. NEVER entity state.
  kaine-trainer-jobs:
    name: kaine-trainer-jobs
  # The entity's life: CAL-gated forks, preservation bundles, individuation,
  # world/self models, control state, audit + incident logs. Owner-only perms
  # preserved inside the container; encrypted at rest when state encryption is
  # on. Survives down/up. NO raw-sense-data path exists here.
  kaine-state:
    name: kaine-state
  # Evaluation outputs (run manifests + artifacts), shared read/write between
  # the cycle (writer) and Nexus (admissibility reader). Subsumes the old
  # kaine-runs volume that covered only /app/data/evaluation/runs — operators
  # migrate by copying any existing runs data in. Metadata only — never raw
  # sense data.
  kaine-eval-data:
    name: kaine-eval-data
  # Workspace-trajectory records, durable across down/up, shared with Nexus.
  kaine-trajectory:
    name: kaine-trajectory
  # Study directories for the module-ignition study: plan, step log, per-line
  # config links and analysis reports.
  kaine-studies:
    name: kaine-studies
  # Preservation bundles from the divergence monitor and welfare response
  # (durable, never raw sense data).
  kaine-backups:
    name: kaine-backups
  # Film-aligned ignition log records (durable, never raw sense data).
  kaine-ignition:
    name: kaine-ignition
  # Local-only record of what Nexus displays, after its privacy filter. Never
  # exported. About 2 GB per four-hour viewing.
  kaine-nexus-record:
    name: kaine-nexus-record
