#
# CPU-only overlay (design §4: "the always-works fallback"). Drops every GPU
# device reservation and selects the CPU image flavor / CPU server images. Fully
# functional, substantially slower (paper §4.1).
#
#   KAINE_FLAVOR=cpu \
#     docker compose -f compose/kaine.yml -f compose/kaine.cpu.yml up -d
#
# Build the CPU image once:
#   docker build -t kaine:cpu \
#     --build-arg FLAVOR=cpu \
#     --build-arg BUILD_BASE=python:3.12-slim \
#     --build-arg RUNTIME_BASE=python:3.12-slim .

services:
  kaine-model-server:
    # llama.cpp build b11382 pinned by digest; bumps change compose/kaine*.yml, quadlet and the trainer converter together.
    image: ${KAINE_MODEL_SERVER_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:559ac229adefe0f7e2d4e32f5222f26927b6bb8ba44b9db08e2544afebf41984}
    deploy:
      resources:
        reservations:
          devices: []
  kaine-chatterbox:
    deploy:
      resources:
        reservations:
          devices: []
  kaine-nexus:
    image: ${KAINE_IMAGE:-kaine:cpu}
    build:
      args:
        FLAVOR: cpu
  kaine-cycle:
    image: ${KAINE_IMAGE:-kaine:cpu}
    build:
      args:
        FLAVOR: cpu
    deploy:
      resources:
        reservations:
          devices: []
  kaine-study:
    image: ${KAINE_IMAGE:-kaine:cpu}
    build:
      args:
        FLAVOR: cpu
    deploy:
      resources:
        reservations:
          devices: []
  # Voice-alignment training needs a GPU; on a CPU host the trainer service's own
  # device check refuses to train. The reservation is dropped so the stack renders.
  kaine-trainer:
    deploy:
      resources:
        reservations:
          devices: []
