# Study configuration: the competitive arm of the workspace-mediation test (paper
# §6.3, A.8). Select it for a run with KAINE_STUDY=workspace_mediation_competitive.
# It is applied after the operator config, so these settings hold for the run.
# The run's seed comes from [experiment].seed; run r of every arm uses the same
# seed.

[language]
# Greedy decoding in the planned runs (paper §6.1).
temperature = 0.0

[workspace]
arm = "competitive"
# Emotion regulation's tier-1 selection bias stays neutral in every arm
# (paper §3.5), so the A.1 ranking by intensity and novelty holds.
regulation_bias = false

[planned_test]
# A live run of the planned test (paper §6.3, Appendix A.8). The boot refuses to
# start without a valid settings record derived from the pilot runs by
# `python -m kaine.experiment.calibrate`, or with a seed the preliminary or pilot
# runs used.
role = "test"
settings_record = "config/studies/workspace_mediation_settings.json"
