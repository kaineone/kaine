# Study configuration: a pilot run of the tone variant of the on arm for the workspace-mediation
# test (paper §6.3, A.8). Select it for a run with KAINE_STUDY=workspace_mediation_pilot_tone.
# It is applied after the operator config, so these settings hold for the run.
# The run's seed comes from [experiment].seed; pilot run r of the tone variant shares its seed
# with pilot run r of the three arms.

[language]
# Greedy decoding in the planned runs (paper §6.1).
temperature = 0.0

[workspace]
arm = "competitive"
# Emotion regulation's tier-1 selection bias stays neutral in every arm
# (paper §3.5), so the A.1 ranking by intensity and novelty holds.
regulation_bias = false
# The interest goal factor is held at one too, for the same ranking.
salience_goal_factor = "static"

[audition]
# The tone variant: every tone event is graded by the tone error ratio alone (paper A.8).
tone_rule = "error_ratio"

[planned_test]
# A pilot run of the tone variant (paper A.8).
role = "pilot"
