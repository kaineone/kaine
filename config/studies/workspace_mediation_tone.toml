# Study configuration: the live run of the tone variant of the on arm for the workspace-mediation
# test (paper §6.3, A.8). Select it for a run with KAINE_STUDY=workspace_mediation_tone.
# It is applied after the operator config, so these settings hold for the run.
# The run's seed comes from [experiment].seed.

[lingua]
# Greedy decoding in the planned runs (paper §6.1).
temperature = 0.0

[syneidesis]
arm = "competitive"

[audition]
# The tone variant: every tone event is graded by the tone error ratio alone (paper A.8).
tone_rule = "error_ratio"

[planned_test]
# A live run of the planned test (paper §6.3, Appendix A.8). The boot refuses to
# start without a valid settings record derived from the pilot runs by
# `python -m kaine.experiment.calibrate`, or with a seed the preliminary or pilot
# runs used.
role = "test"
settings_record = "config/studies/workspace_mediation_settings.json"
