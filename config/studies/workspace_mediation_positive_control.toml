# Study configuration: the positive control's runs before the live test (paper
# §6.3, A.8). Select it for a run with KAINE_STUDY=workspace_mediation_positive_control.
# It is applied after the operator config, so these settings hold for the run.
# The run's seed comes from [experiment].seed; the boot refuses a seed that the
# preliminary or a pilot run used.

[language]
# Greedy decoding in the planned runs (paper §6.1).
temperature = 0.0

[workspace]
arm = "competitive"
# Emotion regulation's tier-1 selection bias stays neutral in every arm
# (paper §3.5), so the A.1 ranking by intensity and novelty holds.
regulation_bias = false

[planned_test]
# The positive control's runs before the live test (paper §6.3, A.8); complete
# runs are checked with `python -m kaine.experiment.positive_control <run ids>`,
# and the live test runs only after it passes for every processor.
role = "positive_control"
settings_record = "config/studies/workspace_mediation_settings.json"

[positive_control]
enabled = true
mode = "control"
settings_record = "config/studies/workspace_mediation_settings.json"
