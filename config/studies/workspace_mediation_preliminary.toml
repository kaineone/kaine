# Study configuration: the preliminary run of the workspace-mediation test (paper
# §6.3, A.8). Select it for a run with KAINE_STUDY=workspace_mediation_preliminary.
# It is applied after the operator config, so these settings hold for the run.
# The run's seed comes from [experiment].seed; this run uses a seed never used
# again.

[language]
# Greedy decoding in the planned runs (paper §6.1).
temperature = 0.0

[workspace]
arm = "competitive"
# Emotion regulation's tier-1 selection bias stays neutral in every arm
# (paper §3.5), so the A.1 ranking by intensity and novelty holds.
regulation_bias = false
# The interest goal factor is held at one too, for the same ranking.
salience_goal_factor = "static"

[planned_test]
# The one preliminary run, on a seed never used again, that estimates each
# processor's first principal component and input mean for the positive control
# (paper A.8); it writes them under data/evaluation/positive_control/<run_id>/
# at shutdown.
role = "preliminary"

[positive_control]
enabled = true
mode = "estimate_pc"
