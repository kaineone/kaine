# The first configuration: the module set the first runs of the entity use.
#
# Apply deliberately:  KAINE_PROFILE=first_configuration python -m kaine.cycle
#               or:    python -m kaine.cycle --profile first_configuration
#
# NOT A DEPLOYMENT TIER. This is the first configuration of the system, the
# smallest one that can test the design hypothesis (Baars global workspace + predictive processing): several DIVERSE
# predictive processors compete for a shared workspace; the winning coalition is
# broadcast back and becomes the context they predict against next; the language
# organ is demoted to an OUTPUT-ONLY voice; and no input path lets a transcript
# reach the model (so it is not a chatbot). Everything is by GATING — every other
# module and the STT code remain built, just switched off, until the hypothesis
# has been tested.
#
# Enabling modules here does NOT mature an entity: the cycle still refuses to boot
# without KAINE_CYCLE_OPERATOR_PRESENT=1 (or the research safety net).

[modules]
# The diverse predictive processors the hypothesis needs: two internal (interoception,
# time) and two externally grounded (foveated vision, raw sound). The workspace
# and the action selection module (action) are always-on scaffolding. The language module is the voice.
interoception = true
sequence = true
vision = true
audition = true
language = true
# Affect/arousal — the global gain: arousal sets the gain and contrast of the competition and
# is itself moved by perceptual surprise. Part of the minimal first-configuration machinery
# (without it the workspace shows no interest or arousal in stimuli), NOT one of the
# richer faculties deferred with the rest.
affect = true
# Sleep: fatigue-triggered rest is part of the first configuration (operator decision of
# 2026-09-08). Consolidation, the affective reset and the stimulus playlist's
# sleep pause all hang off it. Voice alignment stays off ([sleep.voice_alignment]).
sleep = true
# Richer faculties — gated OFF until a positive base result (never deleted).
recorder = false
planning = false
episodic_memory = false
self_model = false
effectors = false
vocal = false
social_cognition = false
world_model = false
perceptual_locus = false
embodiment = false

[perception_feed]
# Out-of-the-box default: the seeded procedural audio-visual feed, so a fresh
# install runs with NO media to supply. This is a thin demonstrator — enough to
# exercise the perceptual processors, but synthetic.
#
# The REPRODUCIBLE PERCEPTUAL RUN uses a fixed REFERENCE STIMULUS CORPUS instead:
# real video-with-audio, decoded directly (no screen-capture, no display/audio
# passthrough), pinned by a per-item sha256 manifest so reproducibility is by
# media identity — anyone with the same publicly-archived set (e.g. an archive.org
# item), played in the same order, reproduces the stimulus. To use it, set the
# media-specific manifest in your local config/kaine.operator.toml (not this
# committed profile), built with tools/build_playlist_manifest.py:
#   [perception_feed]
#   mode = "playlist"
#   playlist_manifest = "/path/to/your/reference-corpus.manifest.toml"
mode = "seeded"
seed = 0

[vision]
# Attention-driven foveation ON: the arousal-sized fovea IS the precision-weighted
# attention the hypothesis names — perception enters as foveated prediction error.
foveation = true

[audition]
# STT-ectomy: audio enters ONLY as prediction error, never as a transcript. The
# entity hears the sound of speech; it does not read it. The STT code is preserved,
# just bypassed — closing the chatbot confound in the ablation.
transcription_enabled = false
# Acoustic perception path ON: every window is encoded and scored by change +
# forward-model prediction error → audition.perception competes in the workspace.
general_audition = true

[action_selection]
# Self-initiated voice: speech comes from the entity's OWN precision-weighted
# surprise (a report threshold above the access threshold, novelty- and
# refractory-gated), never from a user utterance. No chatbot trigger.
policy = "self_initiated_report"
drive_initiative = false
# Novelty-signature expiry: the coarse (source, type) signature otherwise
# suppresses same-signature reports forever — on a stable stimulus (one film
# playing for ~90 min) the top coalition rarely changes signature, and external
# speech would trend to zero over a multi-day run. Five minutes keeps the
# no-chatter novelty gate while letting genuinely new surprise about the same
# source report again.
sig_expiry_s = 300.0

[sequence]
# The sequence module predicts the next broadcast and publishes temporal prediction errors.
# The shipped kaine.toml keeps the forward head off.
forward_prediction = true
